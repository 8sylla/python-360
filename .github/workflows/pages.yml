name: Portail

# Publie portail/ sur GitHub Pages.
#
# Le workflow active Pages lui-même au premier passage (enablement: true).
# Chaque push sur main qui touche portail/ redéploie le site.

on:
  push:
    branches: [main]
    paths:
      - "portail/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; on ne coupe pas celle qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Préparer Pages
        uses: actions/configure-pages@v5
        with:
          # active GitHub Pages si ce n'est pas déjà fait : évite d'avoir à
          # passer par Settings ▸ Pages avant le tout premier déploiement
          enablement: true

      - name: Empaqueter le dossier portail/
        uses: actions/upload-pages-artifact@v3
        with:
          path: portail

      - name: Déployer
        id: deploiement
        uses: actions/deploy-pages@v4
